name: schannel

# Schannel TLS and BCrypt crypto exist only on Windows. This workflow runs on
# changes that can affect that build. The checks need no broker.
on:
  push:
    paths:
      - ".github/workflows/schannel.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/scripts/**"
      - "examples/tls_check.rs"
      - "rdkafka-sys/**"
      - "src/**"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/schannel.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/scripts/**"
      - "examples/tls_check.rs"
      - "rdkafka-sys/**"
      - "src/**"
  workflow_dispatch:

env:
  rust_version: 1.85

jobs:
  schannel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_version }}
      - run: cargo build --features schannel,libz-static --example tls_check
      - name: Offline tls_check checks
        shell: bash
        # Git Bash would turn "/CN=..." into a Windows path.
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          check=target/debug/examples/tls_check.exe
          $check --mode features --expect-features ssl,crypto,tls_schannel,crypto_bcrypt,sasl_scram
          if $check --mode features --expect-features tls_openssl; then
            echo "FAIL: OpenSSL TLS is present"; exit 1
          fi
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=tls-check-ca" \
            -keyout ca.key -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj "/CN=tls-check-client" \
            -keyout client.key -out client.csr
          openssl x509 -req -in client.csr -CA ca.pem -CAkey ca.key -CAcreateserial \
            -days 2 -out client.pem
          tls="-X security.protocol=ssl -X ssl.ca.location=ca.pem"
          $check --mode create $tls
          $check --mode create $tls -X ssl.certificate.location=client.pem \
            -X ssl.key.location=client.key --expect-error ssl.schannel.certificate
          $check --mode create $tls -X ssl.key.location=client.key \
            -X ssl.schannel.certificate=CurrentUser/My/0000000000000000000000000000000000000000 \
            --expect-error "mutually exclusive"
          $check --mode create -X security.protocol=sasl_ssl -X ssl.ca.location=ca.pem \
            -X sasl.mechanisms=SCRAM-SHA-512 -X sasl.username=user -X sasl.password=secret
          $check --mode metadata $tls -X bootstrap.servers=127.0.0.1:1 --timeout 5 \
            --expect-error "metadata"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pefile
      - run: >-
          python .github/scripts/check_imports.py target/debug/examples/tls_check.exe
          bcrypt.dll ncrypt.dll crypt32.dll secur32.dll
      - run: cargo test --features schannel,libz-static
        working-directory: rdkafka-sys

  # The OIDC token fetch uses curl, which curl-sys builds with Schannel, and the
  # JWT assertion signing uses librdkafka's BCrypt backend.
  schannel-oidc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet cryptography pefile
      - run: cargo build --features schannel,curl-static,libz-static --example tls_check
      - run: >-
          python .github/scripts/check_imports.py target/debug/examples/tls_check.exe
          bcrypt.dll ncrypt.dll crypt32.dll secur32.dll
      - name: OIDC through curl and Schannel
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          dir="$(cygpath -m "$RUNNER_TEMP")/oidc"
          python .github/scripts/oidc_token_server.py --dir "$dir" > oidc-server.log 2>&1 &
          server=$!
          trap 'kill $server || true; cat oidc-server.log "$dir/requests.jsonl" || true' EXIT
          for _ in $(seq 1 60); do [ -f "$dir/token-url" ] && break; sleep 1; done
          check=target/debug/examples/tls_check.exe
          $check --mode features \
            --expect-features ssl,crypto,tls_schannel,crypto_bcrypt,sasl_oauthbearer,http,oidc
          # One token request can take the HTTP timeout (20 s) plus retries.
          check="$check --timeout 120"
          oidc=(-X bootstrap.servers=127.0.0.1:1 -X security.protocol=sasl_plaintext
            -X sasl.mechanisms=OAUTHBEARER -X sasl.oauthbearer.method=oidc
            -X "sasl.oauthbearer.token.endpoint.url=$(cat "$dir/token-url")")
          creds=(-X sasl.oauthbearer.client.id=tls-check-client)
          jwt=(-X sasl.oauthbearer.grant.type=urn:ietf:params:oauth:grant-type:jwt-bearer
            -X sasl.oauthbearer.assertion.claim.sub=tls-check)
          ca=(-X "https.ca.location=$dir/ca.pem")
          echo "== client credentials"
          $check --mode oauth "${oidc[@]}" "${creds[@]}" "${ca[@]}" \
            -X sasl.oauthbearer.client.secret=tls-check-secret
          for alg in RS256 ES256; do
            echo "== jwt-bearer $alg"
            key="$dir/assertion-$(echo $alg | tr A-Z a-z).key"
            $check --mode oauth "${oidc[@]}" "${jwt[@]}" "${ca[@]}" \
              -X sasl.oauthbearer.assertion.algorithm=$alg \
              -X "sasl.oauthbearer.assertion.private.key.file=$key"
          done
          echo "== wrong client secret"
          $check --mode oauth "${oidc[@]}" "${creds[@]}" "${ca[@]}" \
            -X sasl.oauthbearer.client.secret=wrong --expect-error "OAUTHBEARER token"
          echo "== wrong CA"
          requests=$(wc -l < "$dir/requests.jsonl")
          $check --mode oauth "${oidc[@]}" "${creds[@]}" \
            -X "https.ca.location=$dir/wrong-ca.pem" \
            -X sasl.oauthbearer.client.secret=tls-check-secret --expect-error "OAUTHBEARER token"
          test "$(wc -l < "$dir/requests.jsonl")" -eq "$requests"
          echo "== server certificate without a CRL distribution point"
          nocdp="$(cygpath -m "$RUNNER_TEMP")/oidc-no-cdp"
          python .github/scripts/oidc_token_server.py --dir "$nocdp" --no-cdp > no-cdp.log 2>&1 &
          trap 'kill $server $! || true; cat oidc-server.log "$dir/requests.jsonl" || true' EXIT
          for _ in $(seq 1 60); do [ -f "$nocdp/token-url" ] && break; sleep 1; done
          url=$(cat "$dir/token-url")
          nocdp_url=$(cat "$nocdp/token-url")
          $check --mode oauth "${oidc[@]/$url/$nocdp_url}" \
            "${creds[@]}" -X "https.ca.location=$nocdp/ca.pem" \
            -X sasl.oauthbearer.client.secret=tls-check-secret --expect-error "revocation"
          python - "$dir/requests.jsonl" <<'PY'
          import json, sys
          seen = [json.loads(line) for line in open(sys.argv[1])]
          print(seen)
          assert {"grant_type": "client_credentials", "ok": True} in [
              {k: r[k] for k in ("grant_type", "ok")} for r in seen]
          for alg in ("RS256", "ES256"):
              assert any(r.get("alg") == alg and r["ok"] for r in seen), alg
          assert any(r["grant_type"] == "client_credentials" and not r["ok"] for r in seen)
          print("PASS: the endpoint saw every expected request")
          PY

  # Kerberos through SSPI needs a domain and a KDC. This job checks only that
  # the build selects the SSPI provider for GSSAPI.
  schannel-gssapi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_version }}
      - run: cargo build --features gssapi-sspi,libz-static --example tls_check
      - name: GSSAPI client through SSPI
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          check=target/debug/examples/tls_check.exe
          $check --mode features --expect-features sasl,sasl_gssapi,tls_schannel,crypto_bcrypt
          gssapi=(-X sasl.mechanisms=GSSAPI -X sasl.kerberos.service.name=kafka)
          $check --mode create "${gssapi[@]}" -X security.protocol=sasl_plaintext \
            -X debug=security --log-level 7 2>&1 | tee create.log
          grep -F "Selected provider Win32 SSPI for SASL mechanism GSSAPI" create.log
          $check --mode create "${gssapi[@]}" -X security.protocol=sasl_ssl
          $check --mode metadata "${gssapi[@]}" -X security.protocol=sasl_plaintext \
            -X bootstrap.servers=127.0.0.1:1 --timeout 5 --expect-error metadata

  schannel-dynamic-linking:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pefile
      - run: cargo build --features schannel-dynamic-linking,libz-static --example tls_check
      - name: Ship rdkafka.dll next to tls_check
        shell: bash
        run: cp target/debug/build/rdkafka-sys-*/out/bin/rdkafka.dll target/debug/examples/
      - run: python .github/scripts/check_imports.py target/debug/examples/tls_check.exe rdkafka.dll
      - run: >-
          python .github/scripts/check_imports.py target/debug/examples/rdkafka.dll
          bcrypt.dll ncrypt.dll crypt32.dll secur32.dll
      - name: Offline tls_check checks
        shell: bash
        run: |
          set -euo pipefail
          check=target/debug/examples/tls_check.exe
          $check --mode features --expect-features ssl,crypto,tls_schannel,crypto_bcrypt,sasl_scram
          $check --mode create -X security.protocol=sasl_ssl -X sasl.mechanisms=SCRAM-SHA-512 \
            -X sasl.username=user -X sasl.password=secret
          $check --mode metadata -X security.protocol=ssl -X bootstrap.servers=127.0.0.1:1 \
            --timeout 5 --expect-error metadata
      - run: cargo test --features schannel-dynamic-linking,libz-static
        working-directory: rdkafka-sys

  schannel-static-linking:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: lukka/get-cmake@latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pefile
      - name: Build and install static librdkafka builds
        shell: bash
        run: |
          set -euo pipefail
          build() {
            cmake -S rdkafka-sys/librdkafka -B "build-$1" -DRDKAFKA_TLS_BACKEND=$2 \
              -DRDKAFKA_CRYPTO_BACKEND=$3 -DRDKAFKA_BUILD_STATIC=ON -DWITH_SASL=ON \
              -DWITH_CURL=OFF -DWITH_ZLIB=OFF -DWITH_ZSTD=OFF -DENABLE_LZ4_EXT=OFF \
              -DRDKAFKA_BUILD_TESTS=OFF -DRDKAFKA_BUILD_EXAMPLES=OFF
            cmake --build "build-$1" --config Release --parallel
            cmake --install "build-$1" --config Release --prefix "$RUNNER_TEMP/rdkafka-$1"
          }
          build schannel schannel bcrypt
          build none none none
      - name: Link the prebuilt Schannel library
        shell: bash
        run: |
          set -euo pipefail
          export DEP_LIBRDKAFKA_STATIC_ROOT="$RUNNER_TEMP/rdkafka-schannel"
          cargo build --no-default-features --features schannel-static-linking --example tls_check
          check=target/debug/examples/tls_check.exe
          $check --mode features --expect-features ssl,crypto,tls_schannel,crypto_bcrypt,sasl_scram
          $check --mode metadata -X security.protocol=ssl -X bootstrap.servers=127.0.0.1:1 \
            --timeout 5 --expect-error metadata
          python .github/scripts/check_imports.py $check bcrypt.dll ncrypt.dll crypt32.dll secur32.dll
          cd rdkafka-sys
          cargo test --no-default-features --features schannel-static-linking
      - name: Refuse a prebuilt library without Schannel
        shell: bash
        run: |
          export DEP_LIBRDKAFKA_STATIC_ROOT="$RUNNER_TEMP/rdkafka-none"
          if cargo build --no-default-features --features schannel-static-linking \
            --example tls_check > refuse.log 2>&1; then
            echo "FAIL: a build without Schannel was linked"; exit 1
          fi
          grep -F "is not a static Schannel and BCrypt librdkafka" refuse.log
