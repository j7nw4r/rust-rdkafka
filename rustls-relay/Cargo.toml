[package]
name = "rustls-relay"
version = "0.0.0"
edition = "2021"
publish = false
description = "Prototype: TLS for rust-rdkafka through Rustls or SChannel, with librdkafka built without OpenSSL"
license = "MIT"

[features]
default = ["ring"]
ring = ["rustls/ring"]
symcrypt = ["dep:rustls-symcrypt", "rustls/custom-provider"]
schannel = ["dep:native-tls", "dep:tokio-native-tls"]

[dependencies]
rdkafka = { path = "..", default-features = false, features = ["tokio"] }
log = "0.4"
rustls = { version = "0.23.31", default-features = false, features = ["std", "tls12", "logging"] }
rustls-symcrypt = { version = "0.2.3", optional = true }
socket2 = "0.6"
tokio = { version = "1.45", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }

[dev-dependencies]
env_logger = "0.11"
rcgen = "0.14"
tokio = { version = "1.45", features = ["macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# native-tls uses OpenSSL on other targets, so it is a Windows-only dependency.
[target.'cfg(windows)'.dependencies]
native-tls = { version = "0.2.18", optional = true }
tokio-native-tls = { version = "0.3.1", optional = true }
